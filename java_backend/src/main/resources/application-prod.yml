# ══════════════════════════════════════════════════════════════
# 生产环境配置:java -jar xxx.jar --spring.profiles.active=prod
# 所有敏感项无默认值,必须通过环境变量注入,缺失即启动失败(故意)
# ══════════════════════════════════════════════════════════════
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ai-quant-backend
  datasource:
    # MySQL 8.0(需先执行 schema-mysql.sql 建库建表)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_quant}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 生产不自动执行 schema,由 DBA 手工执行 schema-mysql.sql
      mode: never
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiquant.model
  configuration:
    map-underscore-to-camel-case: true

# 生产:关闭嵌入式 Redis,使用独立 Redis(上方 spring.redis)
redis:
  embedded: false

# 生产:禁止 mock 短信码回传(必须已接入真实短信网关)
sms:
  mock-return-code: false

# 邀请码:留空=不强制;内测阶段可注入固定码
invite:
  code: ${INVITE_CODE:}

# 交易市场白名单:生产默认只放加密(A 股待产品确认后放开)
trading:
  allowed-markets: ${TRADING_ALLOWED_MARKETS:crypto}

# 敏感接口限流(固定窗口按 IP)
rate-limit:
  enabled: true
  window-seconds: 60
  sms-send: 15
  login: 30
  register: 15
  password-reset: 10

# 监控指标(/api/v1/actuator/prometheus,建议仅内网暴露)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 生产:正式域名白名单(逗号分隔,必须注入)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# JWT:密钥必须环境变量注入,无默认值
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时(毫秒)
  header: Authorization
  prefix: "Bearer "

# API Key AES 密钥:必须环境变量注入,无默认值(泄露=所有用户交易所凭据泄露)
security:
  api-key-secret: ${API_KEY_SECRET}

# 风控配置
risk:
  single-loss-ratio: 0.02
  daily-loss-circuit-breaker: 0.03
  max-positions: 5
  check-interval: 600

# 交易所配置
exchange:
  binance:
    base-url: https://api.binance.com
    # 实盘开关:testnet 联调通过后才允许 true;联调期把 base-url 切为 testnet-url
    live-enabled: ${BINANCE_LIVE_ENABLED:false}
    testnet-url: https://testnet.binance.vision
  okx:
    base-url: https://www.okx.com
    api-key: ${OKX_API_KEY:}
    secret-key: ${OKX_SECRET_KEY:}
    passphrase: ${OKX_PASSPHRASE:}

logging:
  level:
    root: warn
    com.aiquant: info

# AI 服务地址(Python FastAPI;生产部署在同机内网时可用默认值)
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  auto-trade-enabled: ${AI_AUTO_TRADE_ENABLED:false}
