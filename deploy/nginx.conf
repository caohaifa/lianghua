# AI 量化平台 Nginx 配置(Flutter Web + Admin Web + API/WS 反代)
# 放置: /etc/nginx/conf.d/ai-quant.conf
# HTTPS: 建议用 certbot --nginx 自动配置,证书段见文末样例

# ── 用户端(Flutter Web)──────────────────────────────────────
server {
    listen 80;
    server_name app.example.com;          # TODO: 换成正式域名

    root /opt/ai-quant/flutter-web;       # flutter build web 产物(build/web)
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹静态资源长缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ── 管理后台(Admin Web,npm run build 产物 dist)────────────
server {
    listen 80;
    server_name admin.example.com;        # TODO: 换成正式域名;建议叠加 IP 白名单/VPN

    root /opt/ai-quant/admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── API + 行情 WebSocket 反代 ────────────────────────────────
server {
    listen 80;
    server_name api.example.com;          # TODO: 换成正式域名(与后端 CORS 白名单一致)

    # 用户端/管理端 API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 后端限流按此 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;          # 协议签署含手写签名 Base64
    }

    # 行情 WebSocket(/api/v1/ws/market):Upgrade 头必须
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8080/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;         # 长连接保活
        proxy_send_timeout 3600s;
    }
}

